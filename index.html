<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estoque Gastrô</title>
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estoque Gastrô">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#eef1ec;--card:#fff;--ink:#16241f;--mute:#5d6b65;--line:#d5dcd6;--green:#1f4d3f;--onGreen:#fff;--amber:#c98a1b;--zero:#b3402f;--zeroBg:#f8e6e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a16;--card:#18271f;--ink:#e8efe9;--mute:#9baba3;--line:#2b3d34;--green:#3f8f76;--onGreen:#08130e;--amber:#e0a43a;--zero:#f08a77;--zeroBg:#3a1f1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a16;--card:#18271f;--ink:#e8efe9;--mute:#9baba3;--line:#2b3d34;--green:#3f8f76;--onGreen:#08130e;--amber:#e0a43a;--zero:#f08a77;--zeroBg:#3a1f1a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif;padding-bottom:170px}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2{font-family:"Barlow Condensed",Barlow,sans-serif;margin:0;letter-spacing:.2px}
h1{font-size:34px;line-height:1.05}
h2{font-size:20px;margin:22px 0 6px;color:var(--green)}
.sub{color:var(--mute);margin:6px 0 0}
a.back{display:inline-block;color:var(--mute);text-decoration:none;padding:8px 0;font-weight:500}
.big{display:block;text-decoration:none;color:var(--onGreen);background:var(--green);border-radius:14px;padding:26px 20px;margin-top:14px}
.big.k{background:var(--amber);color:#1c1405}
.big b{display:block;font:700 40px/1 "Barlow Condensed",sans-serif}
.big span{display:block;margin-top:8px;opacity:.9}
input.q,input.add{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-top:14px}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px;margin-top:6px}
.row.z{background:var(--zeroBg);border-color:var(--zero)}
.nm{flex:1;min-width:0;font-weight:500}
.row button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:24px;line-height:1}
.row input{width:56px;height:44px;text-align:center;font:600 20px Barlow,sans-serif;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.row.z input{color:var(--zero)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:16px;margin-top:14px;color:var(--mute)}
.btn{font:600 16px Barlow,sans-serif;border:0;border-radius:10px;padding:13px 16px;background:var(--green);color:var(--onGreen);text-decoration:none;text-align:center;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{margin-top:10px;width:100%}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
footer div{max-width:560px;margin:0 auto}
footer p{margin:0 0 8px;color:var(--mute);font-size:14px}
footer .bt{display:flex;flex-wrap:wrap;gap:8px}
footer #wa{flex-basis:100%}
footer .bt>*{flex:1}
</style>
</head>
<body>
<main id="app"></main>
<footer id="ft" hidden></footer>
<script>
var RAW={bar:[["Cervejas",`88 Original
47 Boa
38 Amstel
9 Heineken
27 Amstel Lager Long
2 Baden Cristal
2 Golden
2 Coentro Laranja
4 Eisenbahn Pale Ale Long
4 Eisenbahn Weizenbier
8 Lagunitas
7 Eisenbahn Lata
0 Heineken Zero Long
0 Heineken Long
0 Amstel Ultra`],["Refrigerantes, sucos e águas",`5 Suco Mitto Caju
6 Suco Uva Del Vale
5 Suco Skinka
2 Suco de Cranberry
4 Tônica Fyz
2 Tônica Fyz Guaraná
9 Tônica
2 Schweppes
6 Sprite Zero
0 Sprite
4 Guaraná
4 Coca-Cola Lata
8 Coca-Cola Zero
17 Coca-Cola KS
31 Fanta
5 Água com Gás Mamba
3 Água Abacaxi Hortelã
1 Água Manga e Pêssego
19 Água com Gás
17 Água
6 Sprite Lemon`],["Energéticos e mixers",`3 Red Bull Melancia
2 Monster Pacific Punch
1 Monster Lemon
2 Monster Tropical Orange
2 Monster Ultra Sem Açúcar
2 Monster Mango Loko
6 Ginger Ale
4 Espumante Lata
1 Aqua Mix`],["Destilados e licores",`0 Jack Daniel’s
0 Jim Beam
0 Tequila Ouro
0 Tequila Prata
0 Bulldog
3 Sky
1 Absolut
1 Absolut Raspberry
0 Bacardi
0 Montilla
0 Havana 3 Anos
0 Havana 7 Anos
3 Velho Barreiro
2 Sagatiba
0 Boazinha
0 Zambuzera
0 Campari Cask Tales
0 Cynar
0 Fernet
0 Lillet
2 Campari
11 Aperol
2 Malibu
0 Amaro
0 Jägermeister
0 Ballantine’s
0 Ballantine’s Sunshine
0 Jameson
0 Jack Daniel’s Fire
0 Jack Daniel’s Apple
0 Honey
0 Chivas 12
0 Chivas 13
1 Chivas 18
0 Wild Turkey
1 Woodford Reserve
1 Maker’s Mark
1 Beefeater Lemon e Ginger
2 Beefeater
1 Beefeater 24
0 Martini Bianco
1 Tequila Espolòn
3 Frangelico
1 Amaretto
1 Goly
1 Cointreau
1 Espumante Brut
0 Licor 43
0 Vermouth Rosso
1 Vermouth Seco
1 Limoncello`]],cozinha:[["Linguiças e carnes",`0 Provolone e mel (500g)
2 Manjericão e tomate seco (500g)
1 Cuiabana (500g)
0 Costela com mandioca (300g)
2 Costela e bacon (300g)
8 Filé mignon (150g)
5 Mignon suíno (150g)
1 Carne seca (150g)
4 Drummet (350g)
3 Tilápia (300g)
3 Filé de frango jantinha (150g)
4 Ancho jantinha (150g)`],["Bolinhos de buteco",`5 Feijoada
2 Anjinho
5 Espinafre
4 Carne seca`],["Fritos",`1 Polenta Pupueto
1 Polenta palito
1 Batata rústica
1 Batata palito
0.5 Mandioca pré-frita
0 Pão de alho`]]};
var NOMES={bar:"Bar",cozinha:"Cozinha"},KEY="gastro-estoque-v1",S={v:{},extra:{bar:[],cozinha:[]},rm:false};
try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.v)S=s;else seed()}catch(e){seed()}
if(S.v["bar|Aper"]!==undefined){S.v["bar|Aperol"]=S.v["bar|Aper"];delete S.v["bar|Aper"]}
function tsv(a){var d=new Date().toLocaleDateString("pt-BR"),o="Data\tÁrea\tGrupo\tItem\tQuantidade\n";groups(a).forEach(function(g){g.it.forEach(function(n){var x=val(a,n);if(x!=="")o+=d+"\t"+NOMES[a]+"\t"+g.n+"\t"+n+"\t"+String(x).replace(".",",")+"\n"})});return o}
function seed(){["bar","cozinha"].forEach(function(ar){RAW[ar].forEach(function(g){g[1].split("\n").forEach(function(l){var m=l.match(/^([\d.]+) (.+)$/);if(m)S.v[ar+"|"+m[2]]=+m[1]})})})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function groups(a){var gs=(RAW[a]||[]).map(function(g){return{n:g[0],it:g[1].split("\n").map(function(l){return l.replace(/^[\d.]+ /,"")})}});if(S.extra[a].length)gs.push({n:"Itens adicionados",it:S.extra[a]});return gs}
function val(a,n){var x=S.v[a+"|"+n];return x===undefined||x===null?"":x}
function stats(a){var t=0,c=0,z=[];groups(a).forEach(function(g){g.it.forEach(function(n){t++;var x=val(a,n);if(x!==""){c++;if(x===0)z.push(n)}})});return{t:t,c:c,z:z}}
function hoje(){return new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})}
function msg(a){var st=stats(a),o="ESTOQUE "+NOMES[a].toUpperCase()+" "+hoje()+"\n";groups(a).forEach(function(g){var l=g.it.filter(function(n){return val(a,n)!==""}).map(function(n){return val(a,n)+" "+n});if(l.length)o+="\n"+l.join("\n")+"\n"});
if(st.z.length)o+="\nZERADOS ("+st.z.length+"): "+st.z.join(", ")+"\n";if(st.t>st.c)o+="\nNÃO CONTADOS: "+(st.t-st.c)+" itens\n";return o}
function render(){var a=(location.hash||"").slice(1),app=document.getElementById("app"),ft=document.getElementById("ft");
if(!NOMES[a]){ft.hidden=true;var h='<h1>Estoque Gastrô</h1><p class="sub">Escolha a área e faça a contagem de hoje.</p>';
["bar","cozinha"].forEach(function(k){var st=stats(k);h+='<a class="big'+(k=="cozinha"?" k":"")+'" href="#'+k+'"><b>'+NOMES[k]+'</b><span>'+(st.t?st.c+" de "+st.t+" itens contados · "+st.z.length+" zerados":"Nenhum item ainda")+'</span></a>'});
app.innerHTML=h;return}
var h='<a class="back" href="#">‹ Início</a><h1>Contagem do '+NOMES[a].toLowerCase()+'</h1>';
h+='<p class="sub">Valores de partida: contagem de '+(a=="bar"?"27/10":"24/10")+'. Ajuste o que mudou e envie.</p>';
h+='<input class="q" id="q" type="search" placeholder="Buscar item" autocomplete="off"><div id="list">';
var any=false;groups(a).forEach(function(g){if(!g.it.length)return;any=true;h+='<section><h2>'+esc(g.n)+'</h2>';g.it.forEach(function(n){var x=val(a,n);h+='<div class="row'+(x===0?" z":"")+'" data-n="'+esc(n)+'"><span class="nm">'+esc(n)+'</span><button data-a="-" aria-label="Menos">−</button><input inputmode="decimal" placeholder="–" value="'+x+'" aria-label="Quantidade de '+esc(n)+'"><button data-a="+" aria-label="Mais">+</button></div>'});h+='</section>'});
if(!any)h+='<div class="empty">Nenhum item ainda. Adicione o primeiro abaixo.</div>';
h+='</div><h2>Novo item</h2><input class="add" id="add" placeholder="Nome do item" autocomplete="off"><button class="btn sm" id="addb">Adicionar item</button><button class="btn alt sm" id="clr">'+(S.rm?"Confirmar: limpar todas as quantidades":"Começar nova contagem")+'</button>';
app.innerHTML=h;ft.hidden=false;foot(a);
var list=document.getElementById("list");
list.addEventListener("input",function(e){if(e.target.tagName!="INPUT")return;set(a,e.target.parentNode,e.target.value.replace(",",".").replace(/[^\d.]/g,""),e.target)});
list.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var r=b.parentNode,i=r.querySelector("input"),x=i.value===""?0:+i.value;x=b.dataset.a=="+"?x+1:Math.max(0,x-1);i.value=x;set(a,r,String(x),i)});
document.getElementById("q").addEventListener("input",function(e){var t=e.target.value.toLowerCase();list.querySelectorAll(".row").forEach(function(r){r.style.display=r.dataset.n.toLowerCase().indexOf(t)>-1?"":"none"})});
document.getElementById("addb").onclick=function(){var i=document.getElementById("add"),n=i.value.trim();if(!n)return;if(S.extra[a].indexOf(n)<0)S.extra[a].push(n);S.rm=false;save();render()};
document.getElementById("clr").onclick=function(){if(!S.rm){S.rm=true;render();return}S.v={};S.rm=false;save();render()}}
function set(a,row,v,inp){if(inp)inp.value=v;S.v[a+"|"+row.dataset.n]=v===""?null:+v;S.rm=false;row.classList.toggle("z",v!==""&&+v===0);save();foot(a)}
function foot(a){var st=stats(a),ft=document.getElementById("ft"),m=msg(a);
ft.innerHTML='<div><p>'+st.c+' de '+st.t+' itens contados · '+st.z.length+' zerados</p><div class="bt"><a class="btn" id="wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(m)+'">Enviar no WhatsApp</a><button class="btn alt" id="cp">Copiar texto</button><button class="btn alt" id="cs">Copiar p/ planilha</button></div></div>';
function wire(id,m,lab){document.getElementById(id).onclick=function(){var b=this;function ok(){b.textContent="Copiado";setTimeout(function(){b.textContent=lab},1500)}
try{navigator.clipboard.writeText(m).then(ok,fb)}catch(e){fb()}
function fb(){var t=document.createElement("textarea");t.value=m;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){}document.body.removeChild(t)}}}
wire("cp",m,"Copiar texto");wire("cs",tsv(a),"Copiar p/ planilha")}
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0)});
render();
</script>
</body>
</html>
